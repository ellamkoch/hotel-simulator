<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Simulated Hotel!</title>
    
    <!--Styles-->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <h1 class="intro">Welcome to the Simulated Hotel!</h1>
        <p>Remember to enter all guest information fully when checking in a guest.</p>
        <p>If you need help, reach out to a coworker or a supervisor. If none are available, consult the manual.</p>
        <!-- Checkin Form container-->
        <form action="" class ="checkin_form" id="checkin_form">
        <h2 class="checkin">Check-In Form</h2> 
            <div class="checkin_form_row">
                <!--Guest Name-->
                <div class="checkin_form_field">
                    <label for="guestName" class="checkin_form_field_label">Guest Name:</label>
                    <input type="text" id="guestName" name="guestName" class="checkin_form_field_input" required>
                </div>
                
                <!--Room Number-->
                <div class="checkin_form_field">
                    <label for="roomNumber" class="checkin_form_field_label">Room Number:</label>
                    <input type="number" id="roomNumber" name="roomNumber" class="checkin_form_field_input" required>
                </div>
                
                <!--Stay Duration-->
                <div class="checkin_form_field">
                    <label for="stayDuration" class="checkin_form_field_label">Stay Duration:</label>
                    <input type="number" id="stayDuration" name="stayDuration" class="checkin_form_field_input" required>
                </div>
            </div>
        </form>

        <!-- Guest List container-->
        <h2 class="guestlist">Guest List</h2>
        <div id="guest_list_container" class="guest_list_container">
            <div id="guest_list_cards" class="guest_list_cards">




                
            </div>

        </div>

        



    </main>
    <!-- JavaScript-->
    <script src="./script.js"></script>
</body>
</html>
